name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests-linux:
    name: Host Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure and build C11 core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run C11 CTest suite
        run: ctest --test-dir build --output-on-failure

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run WebHID Node tests and bundle check
        run: |
          node --test tests/test_web_protocol.mjs tests/test_web_hid.mjs tests/test_web_radio.mjs tests/test_web_pages.mjs
          node tools/build_web_pages.mjs --out _site

  host-tests-windows:
    name: Host Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure and build C11 core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Run C11 CTest suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run WebHID Node tests
        run: node --test tests/test_web_protocol.mjs tests/test_web_hid.mjs tests/test_web_radio.mjs tests/test_web_pages.mjs

  firmware-build:
    name: Firmware Build (BL616 m62_12f)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build BL616 firmware
        uses: ./.github/actions/build-firmware
        with:
          board: m62_12f
          out-dir: dist/firmware

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: m62-firmware-ci
          path: dist/firmware
          retention-days: 14
