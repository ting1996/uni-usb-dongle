name: Build BL616 Firmware
description: Verify the third_party/bouffalo_sdk submodule and T-Head RISC-V toolchain, build BL616 firmware, verify slot 0 size, and package artifacts.

inputs:
  board:
    description: Target board profile (m62_12f or bl616dk)
    required: false
    default: "m62_12f"
  out-dir:
    description: Output directory for packaged firmware artifacts
    required: false
    default: "dist/firmware"

runs:
  using: "composite"
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        if ! command -v ninja >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ninja-build
        fi

    - name: Verify Bouffalo SDK submodule
      shell: bash
      run: |
        set -euo pipefail
        SDK_BASE="${{ github.workspace }}/third_party/bouffalo_sdk"
        if [ ! -f "${SDK_BASE}/project.build" ]; then
          git submodule update --init --depth 1 third_party/bouffalo_sdk
        fi
        test -f "${SDK_BASE}/project.build"

    - name: Cache T-Head RISC-V toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: ~/toolchains/xuantie-v2.10.2
        key: xuantie-gcc-riscv-v2.10.2-linux-x86_64-v1

    - name: Download T-Head RISC-V toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        TOOLCHAIN_URL="https://github.com/bouffalolab/toolchain/releases/download/compact-old/xuantie-gcc-riscv-v2.10.2-linux-x86_64.tar.xz"
        TOOLCHAIN_SHA256="a3a6fd5fe9fce64c09fb6d96cb1075ba114ee466d73bba6be5a4462fee978c83"
        TOOLCHAIN_DIR="$HOME/toolchains/xuantie-v2.10.2"
        ARCHIVE="/tmp/xuantie-gcc-riscv-v2.10.2-linux-x86_64.tar.xz"

        curl -fsSL -o "${ARCHIVE}" "${TOOLCHAIN_URL}"
        echo "${TOOLCHAIN_SHA256}  ${ARCHIVE}" | sha256sum -c -
        rm -rf "${TOOLCHAIN_DIR}"
        mkdir -p "${TOOLCHAIN_DIR}"
        tar -xJf "${ARCHIVE}" -C "${TOOLCHAIN_DIR}"
        rm -f "${ARCHIVE}"

    - name: Locate toolchain and ensure permissions
      shell: bash
      run: |
        set -euo pipefail
        SDK_BASE="${{ github.workspace }}/third_party/bouffalo_sdk"
        TOOLCHAIN_DIR="$HOME/toolchains/xuantie-v2.10.2"
        GCC_PATH="$(find "${TOOLCHAIN_DIR}" -type f -name 'riscv64-unknown-elf-gcc' | head -n 1 || true)"
        if [ -z "${GCC_PATH}" ]; then
          echo "Error: riscv64-unknown-elf-gcc not found under ${TOOLCHAIN_DIR}" >&2
          exit 1
        fi
        TOOLCHAIN_BIN="$(dirname "${GCC_PATH}")"
        chmod -R +x "${TOOLCHAIN_BIN}"
        "${TOOLCHAIN_BIN}/riscv64-unknown-elf-gcc" --version
        echo "TOOLCHAIN_BIN=${TOOLCHAIN_BIN}" >> "${GITHUB_ENV}"

        if [ -d "${SDK_BASE}/tools/cmake/bin" ]; then
          chmod -R +x "${SDK_BASE}/tools/cmake/bin"
        fi
        if [ -f "${SDK_BASE}/tools/bflb_tools/bflb_fw_post_proc/bflb_fw_post_proc-ubuntu" ]; then
          chmod +x "${SDK_BASE}/tools/bflb_tools/bflb_fw_post_proc/bflb_fw_post_proc-ubuntu"
        fi

    - name: Build firmware
      shell: bash
      run: |
        SDK_BASE="${{ github.workspace }}/third_party/bouffalo_sdk"
        export PATH="${TOOLCHAIN_BIN}:$PATH"
        make -C firmware \
          BOARD="${{ inputs.board }}" \
          BL_SDK_BASE="${SDK_BASE}" \
          CROSS_COMPILE="${TOOLCHAIN_BIN}/riscv64-unknown-elf-"

    - name: Verify slot 0 size and package artifacts
      shell: bash
      run: |
        set -euo pipefail
        BUILD_OUT="firmware/build/build_out"
        APP_BIN="${BUILD_OUT}/uni_usb_dongle_bl616.bin"
        MAX_BYTES=2097152

        if [ ! -s "${APP_BIN}" ]; then
          echo "Error: Missing or empty firmware image: ${APP_BIN}" >&2
          exit 1
        fi

        SIZE=$(wc -c < "${APP_BIN}" | tr -d '[:space:]')
        echo "Built ${APP_BIN}: ${SIZE} bytes (slot 0 limit: ${MAX_BYTES} bytes)"
        if [ "${SIZE}" -gt "${MAX_BYTES}" ]; then
          echo "Error: ${APP_BIN} (${SIZE} bytes) exceeds 2 MiB slot 0 limit (${MAX_BYTES} bytes)" >&2
          exit 1
        fi

        OUT_DIR="${{ inputs.out-dir }}"
        mkdir -p "${OUT_DIR}"
        for f in \
          uni_usb_dongle_bl616.bin \
          uni_usb_dongle_bl616.bin.ota \
          uni_usb_dongle_bl616.xz \
          uni_usb_dongle_bl616.xz.ota \
          uni_usb_dongle_bl616.elf \
          uni_usb_dongle_bl616.map
        do
          if [ -f "${BUILD_OUT}/${f}" ]; then
            cp "${BUILD_OUT}/${f}" "${OUT_DIR}/${f}"
          fi
        done

        (
          cd "${OUT_DIR}"
          sha256sum uni_usb_dongle_bl616.* > SHA256SUMS.txt
        )
        cat "${OUT_DIR}/SHA256SUMS.txt"
